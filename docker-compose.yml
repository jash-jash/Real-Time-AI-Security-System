services:
  security:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      # Example IP camera:
      # - CAMERA_SOURCE=rtsp://user:pass@192.168.1.20:554/stream1
      - CAMERA_SOURCE=${CAMERA_SOURCE:-0}
    volumes:
      - ./alerts:/app/alerts
      - ./recordings:/app/recordings
      - ./data:/app/data
    restart: unless-stopped
